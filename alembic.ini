# ==========================================================
# Alembic config â€” VAELQORIX.XDR_COMMAND (v3.2)
# UbicaciÃ³n: VAELQORIX/alembic.ini
# ==========================================================
# DiseÃ±o VAELQORIX:
# âœ… La URL REAL de DB se inyecta desde app.core.settings en alembic/env.py
#    (env.py hace: ini_section["sqlalchemy.url"] = settings.SQLALCHEMY_DATABASE_URI)
#
# Por eso:
# - sqlalchemy.url aquÃ­ es SOLO un fallback
# - no necesitas meter credenciales reales aquÃ­ (mejor por .env)
# ==========================================================

[alembic]
script_location = alembic

# Permite importar "app.*" desde la raÃ­z del proyecto cuando ejecutas alembic
# (Ãºtil en Windows / venv / rutas relativas)
prepend_sys_path = .

# ----------------------------------------------------------
# Fallback SOLO para no romper si env.py no sobreescribe la URL
# (NO es la fuente principal en VAELQORIX)
# ----------------------------------------------------------
sqlalchemy.url = sqlite:///./app.db


# ==========================================================
# Logging
# ==========================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# Logger raÃ­z
[logger_root]
level = INFO
handlers = console

# SQLAlchemy engine logs (WARM para no spamear)
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# Alembic logs
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Handler consola
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

# Formato estÃ¡ndar
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s