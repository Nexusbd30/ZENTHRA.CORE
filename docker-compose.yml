# ==========================================================
# VAELQORIX - Observabilidad Stack + PostgreSQL (v3.9.1)
# ==========================================================
# Stack completo: backend, PostgreSQL y observabilidad.
# Expone PostgreSQL en ${VAELQORIX_POSTGRES_PORT:-56432} para acceso local desde herramientas externas.
#
# Nota:
# - El backend dockerizado conecta a postgres por hostname "postgres:5432".
# ==========================================================

services:
  # =========================================================
  # BACKEND - FastAPI API
  # =========================================================
  backend:
    build: .
    container_name: vaelqorix_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"
    environment:
      - ENV=${ENV:-development}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - VAELQORIX_MONITOR_TOKEN=${VAELQORIX_MONITOR_TOKEN:?VAELQORIX_MONITOR_TOKEN is required}
      - ZENTHRA_MONITOR_TOKEN=${VAELQORIX_MONITOR_TOKEN:?VAELQORIX_MONITOR_TOKEN is required}
      - BOOTSTRAP_ADMIN_ENABLED=${BOOTSTRAP_ADMIN_ENABLED:-true}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@vaelqorix.dev}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${VAELQORIX_DB_USER:-vaelqorix}:${VAELQORIX_DB_PASSWORD}@postgres:5432/${VAELQORIX_DB_NAME:-vaelqorix}
      - PROMETHEUS_BASE=http://prometheus:9090
      - ALERTMANAGER_BASE=http://alertmanager:9093
      - ALERTMANAGER_ALLOWED_CIDRS=${ALERTMANAGER_ALLOWED_CIDRS:-172.16.0.0/12,127.0.0.1/32,::1/128}
      - PROM_TIMEOUT_SEC=${PROM_TIMEOUT_SEC:-2}
      - PROM_CACHE_TTL_SECONDS=${PROM_CACHE_TTL_SECONDS:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - RATE_LIMIT_BACKEND=${RATE_LIMIT_BACKEND:-redis}
      - REPLAY_GUARD_BACKEND=${REPLAY_GUARD_BACKEND:-redis}
      - ARES_KILL_SWITCH_BACKEND=${ARES_KILL_SWITCH_BACKEND:-redis}
      - ARES_KILL_SWITCH_KEY=${ARES_KILL_SWITCH_KEY:-ares:kill_switch}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-vaelqorix}
      - VAELQORIX_CONTROL_TOKEN=${VAELQORIX_CONTROL_TOKEN:-}
      - CONTROL_TOKEN_CAPABILITIES=${CONTROL_TOKEN_CAPABILITIES:-}
      - CONTROL_TOKEN_TENANT_ID=${CONTROL_TOKEN_TENANT_ID:-default}
      - SECRET_BACKEND=${SECRET_BACKEND:-file}
      - SECRET_FILE_DIR=${SECRET_FILE_DIR:-/run/secrets}
      - VAELQORIX_PUBLIC_REGISTRATION_ENABLED=${VAELQORIX_PUBLIC_REGISTRATION_ENABLED:-true}
      - ENTERPRISE_TENANT_MODE=${ENTERPRISE_TENANT_MODE:-single_tenant}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - AI_MODEL=${AI_MODEL:-llama3.1:8b}
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:11434}
      - AI_TIMEOUT_SEC=${AI_TIMEOUT_SEC:-8}
      - ACTION_EXECUTION_MODE=${ACTION_EXECUTION_MODE:-provider}
      - ACTION_SHARED_TOKEN=${ACTION_SHARED_TOKEN:-}
      - ACTION_TIMEOUT_SEC=${ACTION_TIMEOUT_SEC:-5}
      - NETWORK_CONTROL_URL=${NETWORK_CONTROL_URL:-}
      - DNS_FIREWALL_CONTROL_URL=${DNS_FIREWALL_CONTROL_URL:-}
      - IDENTITY_CONTROL_URL=${IDENTITY_CONTROL_URL:-}
      - ENDPOINT_CONTROL_URL=${ENDPOINT_CONTROL_URL:-}
      - SOAR_CONTROL_URL=${SOAR_CONTROL_URL:-}
      - CRYPTO_CONTROL_URL=${CRYPTO_CONTROL_URL:-}
      - DEVSECOPS_CONTROL_URL=${DEVSECOPS_CONTROL_URL:-}
      - SOC_WEBHOOK_URL=${SOC_WEBHOOK_URL:-}
      - SOC_WEBHOOK_TOKEN=${SOC_WEBHOOK_TOKEN:-}
      - SOC_WEBHOOK_HMAC_SECRET=${SOC_WEBHOOK_HMAC_SECRET:-}
      - GITHUB_API_BASE_URL=${GITHUB_API_BASE_URL:-https://api.github.com}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_DEFAULT_OWNER=${GITHUB_DEFAULT_OWNER:-}
      - GITHUB_TOKEN_SECRET_NAMES=${GITHUB_TOKEN_SECRET_NAMES:-}
      - KAFKA_INGESTION_ENABLED=${KAFKA_INGESTION_ENABLED:-false}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-127.0.0.1:9092}
      - KAFKA_INGESTION_TOPICS=${KAFKA_INGESTION_TOPICS:-vaelqorix.siem,vaelqorix.edr,vaelqorix.iam,vaelqorix.netflow}
      - KAFKA_CONSUMER_GROUP_ID=${KAFKA_CONSUMER_GROUP_ID:-vaelqorix-core-ingestion}
      - KAFKA_AUTO_OFFSET_RESET=${KAFKA_AUTO_OFFSET_RESET:-latest}
      - KAFKA_POLL_TIMEOUT_SEC=${KAFKA_POLL_TIMEOUT_SEC:-1}
      - VECTOR_STORE_ENABLED=${VECTOR_STORE_ENABLED:-true}
      - VECTOR_STORE_PROVIDER=${VECTOR_STORE_PROVIDER:-sql_local}
      - VECTOR_DIMENSIONS=${VECTOR_DIMENSIONS:-64}
      - VECTOR_COLLECTION_PREFIX=${VECTOR_COLLECTION_PREFIX:-vaelqorix}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - vaelqorix_net

  redis:
    image: redis:7.4-alpine
    container_name: vaelqorix_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vaelqorix_net

  # =========================================================
  # POSTGRES - Base de datos (staging/prod)
  # =========================================================
  postgres:
    image: postgres:16.6-alpine
    container_name: vaelqorix_postgres
    restart: unless-stopped

    # Como tu backend corre en Windows HOST, exponemos el puerto al host
    ports:
      - "${VAELQORIX_POSTGRES_PORT:-56432}:5432"
    environment:
      - POSTGRES_DB=${VAELQORIX_DB_NAME:-vaelqorix}
      - POSTGRES_USER=${VAELQORIX_DB_USER:-vaelqorix}
      - POSTGRES_PASSWORD=${VAELQORIX_DB_PASSWORD:?VAELQORIX_DB_PASSWORD is required}

    volumes:
      # Persistencia real
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaelqorix -d vaelqorix"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - vaelqorix_net

  # =========================================================
  # PROMETHEUS - Observabilidad central
  # =========================================================
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"

    extra_hosts:
      # Permite a Prometheus alcanzar exporters del host (Windows)
      - "host.docker.internal:host-gateway"

    volumes:
      # Config principal y reglas de alerta
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro

      # Token interno (bearer) para /metrics del backend
      - ${PROMETHEUS_MONITOR_TOKEN_FILE:?PROMETHEUS_MONITOR_TOKEN_FILE is required}:/etc/prometheus/secrets/vaelqorix_monitor_token:ro

      # Datos persistentes TSDB
      - prometheus_data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle

    networks:
      - vaelqorix_net

  # =========================================================
  # GRAFANA - Visualizacion
  # =========================================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}

    networks:
      - vaelqorix_net

  # =========================================================
  # ALERTMANAGER - Gestion y ruteo de alertas
  # =========================================================
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager

    networks:
      - vaelqorix_net

  # =========================================================
  # BLACKBOX EXPORTER - Sondeo de endpoints externos
  # =========================================================
  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox_exporter
    restart: unless-stopped

    ports:
      - "9115:9115"

    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

    command:
      - --config.file=/etc/blackbox_exporter/config.yml

    networks:
      - vaelqorix_net

# ==========================================================
# VOLUMES PERSISTENTES
# ==========================================================
volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:

# ==========================================================
# NETWORK (interno)
# ==========================================================
networks:
  vaelqorix_net:
    driver: bridge
