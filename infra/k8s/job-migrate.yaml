apiVersion: batch/v1
kind: Job
metadata:
  name: vaelqorix-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: vaelqorix-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: ghcr.io/your-org/vaelqorix-api:1.0.0
        imagePullPolicy: IfNotPresent
        command: ["alembic"]
        args: ["upgrade", "head"]
        envFrom:
        - configMapRef:
            name: aresx-config
        - secretRef:
            name: aresx-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: secret-files
          mountPath: /run/secrets/aresx
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: secret-files
        secret:
          secretName: aresx-secrets

