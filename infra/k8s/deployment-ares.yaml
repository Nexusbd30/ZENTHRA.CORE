apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares
spec:
  # Keep one replica until kill-switch state is backed by a distributed store.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ares
  template:
    metadata:
      labels:
        app: ares
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ares
        image: ghcr.io/your-org/nexus:1.0.0
        imagePullPolicy: IfNotPresent
        command: ["uvicorn"]
        args: ["app.entrypoints.ares:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: aresx-config
        - secretRef:
            name: aresx-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: runtime-logs
          mountPath: /app/logs
      volumes:
      - name: runtime-logs
        emptyDir: {}
