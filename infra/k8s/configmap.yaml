apiVersion: v1
kind: ConfigMap
metadata:
  name: aresx-config
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  SECRET_BACKEND: "file"
  SECRET_FILE_DIR: "/run/secrets/aresx"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  VAELQORIX_CORRELATION_ENABLED: "true"
  VAELQORIX_CORRELATION_INTERVAL_SEC: "60"
  VAELQORIX_CORRELATION_STARTUP_DELAY_SEC: "10"
  BOOTSTRAP_ADMIN_ENABLED: "false"
