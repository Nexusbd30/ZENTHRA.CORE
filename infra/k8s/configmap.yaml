apiVersion: v1
kind: ConfigMap
metadata:
  name: aresx-config
data:
  ENV: "production"
  LOG_LEVEL: "INFO"
  SECRET_BACKEND: "file"
  SECRET_FILE_DIR: "/run/secrets/aresx"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  VAELQORIX_PUBLIC_REGISTRATION_ENABLED: "false"
  RATE_LIMIT_BACKEND: "redis"
  REPLAY_GUARD_BACKEND: "redis"
  ARES_KILL_SWITCH_BACKEND: "redis"
  REDIS_KEY_PREFIX: "vaelqorix"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "vaelqorix"
  POSTGRES_USER: "vaelqorix"
  REDIS_URL: "redis://redis:6379/0"
  VAELQORIX_CORRELATION_ENABLED: "true"
  VAELQORIX_CORRELATION_INTERVAL_SEC: "60"
  VAELQORIX_CORRELATION_STARTUP_DELAY_SEC: "10"
  BOOTSTRAP_ADMIN_ENABLED: "false"
  ACTION_EXECUTION_MODE: "webhook"
  AI_PROVIDER: "ollama"
  AI_BASE_URL: "http://ollama:11434"
  AI_MODEL: "llama3.1:8b"
  VECTOR_STORE_PROVIDER: "qdrant"
